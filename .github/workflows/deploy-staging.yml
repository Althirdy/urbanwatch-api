name: Deploy Staging
on:
  push:
    branches:
      - staging

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Deployment Script
        run: |
          APP_DIR="$HOME/urbanwatch/uat-api"
          mkdir -p "$APP_DIR"
          rsync -a --delete --exclude '.git' --exclude 'vendor' --exclude 'node_modules' "$GITHUB_WORKSPACE"/ "$APP_DIR"/
          cd "$APP_DIR"
          chmod +x deploy-staging.sh
          ./deploy-staging.sh
