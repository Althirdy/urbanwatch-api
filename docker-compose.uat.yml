services:
  uat-app:
    build: .
    container_name: urbanwatch-uat-app
    restart: always
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    ports:
      - "8001:80"
    volumes:
      - ./:/var/www/html
    environment:
      - APP_ENV=uat
      - APP_DEBUG=true 
      - APP_KEY=${APP_KEY}
      - APP_URL=https://uat.urbanwatch.me
      - DB_CONNECTION=mysql
      - DB_HOST=uat-db
      - DB_PORT=3306
      - DB_DATABASE=urbanwatch_uat 
      - DB_USERNAME=urban_user
      - DB_PASSWORD=urban_password
      - CACHE_STORE=redis
      - REDIS_HOST=uat-redis
      - NPM_CONFIG_CACHE=/var/www/html/.npm-cache
    depends_on:
      - uat-db
      - uat-redis

  uat-queue:
    build: .
    container_name: urbanwatch-uat-queue
    restart: always
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    volumes:
      - ./:/var/www/html
      - /var/www/html/vendor
    command: php artisan queue:work --verbose --tries=3 --timeout=90
    environment:
      - CACHE_STORE=redis
      - REDIS_HOST=uat-redis
      - NPM_CONFIG_CACHE=/var/www/html/.npm-cache
    depends_on:
      - uat-db
      - uat-redis

  uat-db:
    image: mysql:8.0
    container_name: urbanwatch-uat-db
    restart: always
    environment:
      MYSQL_DATABASE: urbanwatch_uat 
      MYSQL_USER: urban_user
      MYSQL_PASSWORD: urban_password
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - uat_db_data:/var/lib/mysql

  uat-redis:
    image: redis:7-alpine
    container_name: urbanwatch-uat-redis
    restart: always

volumes:
  uat_db_data:
